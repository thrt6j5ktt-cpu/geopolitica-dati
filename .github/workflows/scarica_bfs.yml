{"name": "Scarica dati UST",
 "on": {"workflow_dispatch": {}, "schedule": [{"cron": "0 6 1 * *"}]},
 "permissions": {"contents": "write"},
 "jobs": {"scarica": {"runs-on": "ubuntu-latest", "steps": [
  {"name": "Prendi il codice", "uses": "actions/checkout@v4"},
  {"name": "Prepara Python", "uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
  {"name": "Scarica metadati UST", "run": "python scarica_bfs.py"},
  {"name": "Salva i file nel repository", "run": "git config user.name github-actions[bot]\ngit config user.email 41898283+github-actions[bot]@users.noreply.github.com\ngit add bronze\ngit diff --cached --quiet || git commit -m \"Dati UST aggiornati\"\ngit push"}
 ]}}}
